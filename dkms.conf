PACKAGE_NAME="r8169-mainline"
PACKAGE_VERSION="v6.16"

BUILT_MODULE_NAME[0]="r8169"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"

# Optional signing (see §7): if you set mok_{certificate,signing_key} in /etc/dkms/framework.conf,
# DKMS >=3.2.0 will sign the module after build.
